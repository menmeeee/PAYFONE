<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公衆電話システム (4桁接続)</title>
    <!-- Standalone PeerJS Library -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            color: #ffffff;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* Strict Hide Helper */
        .is-hidden {
            display: none !important;
        }

        /* Container Card Styling */
        .card {
            width: 100%;
            max-width: 440px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            margin: auto;
        }

        h1, h2, h3 {
            text-align: center;
            margin-bottom: 12px;
        }

        h1 { color: #34d399; font-size: 1.25rem; }
        h2 { color: #60a5fa; font-size: 1.1rem; }
        h3 { color: #cbd5e1; font-size: 0.85rem; border-bottom: 1px solid #334155; padding-bottom: 6px; }

        .uid-box {
            background-color: #0f172a;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #334155;
            text-align: center;
            margin-bottom: 14px;
        }

        .uid-text {
            font-family: monospace;
            font-size: 2.2rem;
            font-weight: bold;
            color: #facc15;
            letter-spacing: 4px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #ffffff;
            padding: 10px;
            border-radius: 8px;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            box-sizing: border-box;
            font-family: monospace;
            letter-spacing: 2px;
        }

        input:focus {
            border-color: #10b981;
        }

        /* Buttons Styling */
        .btn-grid {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.85rem;
            color: #ffffff;
            cursor: pointer;
            text-align: center;
            display: inline-block;
        }

        .btn-blue { background-color: #2563eb; }
        .btn-blue:active { background-color: #1d4ed8; }
        
        .btn-emerald { background-color: #059669; }
        .btn-emerald:active { background-color: #047857; }

        .btn-red { background-color: #dc2626; }
        .btn-red:active { background-color: #b91c1c; }

        .btn-retry {
            background-color: #d97706;
            color: #fff;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            margin-top: 8px;
            cursor: pointer;
        }

        .status-msg {
            margin-top: 12px;
            text-align: center;
            font-size: 0.8rem;
            color: #facc15;
            font-weight: bold;
        }

        /* Reception Screen Specifics */
        .display-screen {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            margin-bottom: 12px;
        }

        .dial-number {
            font-family: monospace;
            font-size: 2rem;
            font-weight: bold;
            color: #34d399;
            min-height: 48px;
            line-height: 48px;
            letter-spacing: 2px;
            word-break: break-all;
        }

        .setting-box {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 12px;
        }

        .grid-2 {
            display: flex;
            gap: 8px;
        }

        .grid-2 > div {
            flex: 1;
        }

        #keypad-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100svh;
            background-color: #000000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
        }

        .keypad-header {
            width: 100%;
            max-width: 320px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .keypad-input {
            width: 100%;
            max-width: 320px;
            background-color: #050505;
            color: #34d399;
            font-family: monospace;
            font-size: 1.8rem;
            text-align: right;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            min-height: 52px;
            box-sizing: border-box;
            margin-bottom: 16px;
            overflow-x: auto;
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 320px;
        }

        .key-btn {
            background-color: #1e293b;
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: bold;
            height: 60px;
            border-radius: 12px;
            border: 1px solid #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .key-btn:active {
            background-color: #059669;
            transform: scale(0.95);
        }

        .key-special {
            color: #facc15;
        }

        .clear-btn {
            background-color: #450a0a;
            color: #f87171;
            border: 1px solid #7f1d1d;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-top: 12px;
            cursor: pointer;
        }

        .fullscreen-btn {
            background-color: #334155;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Setup Screen (Role Selection & 4-Digit Connection) -->
    <div id="setup-screen" class="card">
        <h1>☎️ 公衆電話 2端末連携</h1>

        <!-- My Short Code Section -->
        <div class="uid-box">
            <label>あなたの4桁コード（相手に入力してもらう番号）</label>
            <div id="my-uid" class="uid-text">----</div>
            <button id="retry-btn" type="button" onclick="initPeer()" class="btn-retry is-hidden">再接続を試す</button>
        </div>

        <!-- Mode Selection / Connection Input -->
        <div class="form-group">
            <label>接続相手の 4桁コード を入力</label>
            <input type="number" id="target-uid" placeholder="例: 1234" pattern="[0-9]*" inputmode="numeric" autocomplete="off">
        </div>

        <div class="btn-grid">
            <button type="button" onclick="startConnection('reception')" class="btn btn-blue">
                🎧 受付側（親機）
            </button>
            <button type="button" onclick="startConnection('keypad')" class="btn btn-emerald">
                🔢 キーパッド（子機）
            </button>
        </div>

        <div id="status-msg" class="status-msg">
            通信サーバー接続中...
        </div>
    </div>

    <!-- Reception Screen (Host / Receiver View) -->
    <div id="reception-screen" class="card is-hidden">
        <h2>🎧 受付側モニター</h2>

        <!-- Dynamic Dial Display -->
        <div class="display-screen">
            <label>受信ダイヤル番号</label>
            <div id="dial-display" class="dial-number">---</div>
        </div>

        <!-- Speech Settings Customization -->
        <div class="setting-box">
            <h3>音声合成（読み上げ）設定</h3>
            <div class="grid-2" style="margin-top: 8px;">
                <div class="form-group">
                    <label>前置き文</label>
                    <input type="text" id="speech-prefix" value="番号 ">
                </div>
                <div class="form-group">
                    <label>後置き文</label>
                    <input type="text" id="speech-suffix" value=" が押されました">
                </div>
            </div>
            <div class="form-group" style="margin-top: 6px;">
                <label>特設メッセージ（「#」ボタン用）</label>
                <input type="text" id="speech-custom-hash" value="通話を開始します">
            </div>
        </div>

        <!-- Audio Control -->
        <div style="display: flex; justify-content: space-between; align-items: center; background-color: #0f172a; padding: 10px; border-radius: 10px; border: 1px solid #334155;">
            <div>
                <div style="font-size: 0.85rem; font-weight: bold;">生音声通話</div>
                <div style="font-size: 0.7rem; color: #94a3b8;" id="audio-status">マイク送受信中</div>
            </div>
            <button type="button" id="mic-toggle-btn" onclick="toggleMic()" class="btn btn-emerald" style="padding: 8px 12px;">
                🎤 マイク ON
            </button>
        </div>

        <audio id="remote-audio" autoplay playsinline></audio>
    </div>

    <!-- Keypad Screen (Client / Fullscreen View) -->
    <div id="keypad-screen" class="is-hidden">
        <div class="keypad-header">
            <span style="font-size: 0.75rem; color: #64748b; font-family: monospace;">KEYPAD MODE</span>
            <button type="button" onclick="requestFullscreen()" class="fullscreen-btn">全画面表示</button>
        </div>

        <div style="width: 100%; display: flex; flex-direction: column; align-items: center; margin: auto 0;">
            <!-- Keypad Display -->
            <div id="keypad-input-display" class="keypad-input"></div>

            <!-- Keypad Matrix Buttons -->
            <div class="keypad-grid">
                <div onclick="pressKey('1')" class="key-btn">1</div>
                <div onclick="pressKey('2')" class="key-btn">2</div>
                <div onclick="pressKey('3')" class="key-btn">3</div>
                <div onclick="pressKey('4')" class="key-btn">4</div>
                <div onclick="pressKey('5')" class="key-btn">5</div>
                <div onclick="pressKey('6')" class="key-btn">6</div>
                <div onclick="pressKey('7')" class="key-btn">7</div>
                <div onclick="pressKey('8')" class="key-btn">8</div>
                <div onclick="pressKey('9')" class="key-btn">9</div>
                <div onclick="pressKey('*')" class="key-btn key-special">＊</div>
                <div onclick="pressKey('0')" class="key-btn">0</div>
                <div onclick="pressKey('#')" class="key-btn key-special">＃</div>
            </div>

            <button type="button" onclick="clearKeypad()" class="clear-btn">クリア</button>
        </div>
    </div>

    <script>
        const ID_PREFIX = 'payphone2026-pin-'; // Hidden prefix to allow 4-digit code usage
        let peer = null;
        let conn = null;
        let mediaCall = null;
        let localStream = null;
        let role = ''; 
        let currentDial = '';
        let micEnabled = true;
        let myShortPin = '';

        // Initialize PeerJS Connection with fallback STUN server
        function initPeer() {
            document.getElementById('retry-btn').classList.add('is-hidden');
            document.getElementById('status-msg').innerText = '通信サーバー接続中...';
            document.getElementById('status-msg').style.color = '#facc15';

            if (peer) {
                try { peer.destroy(); } catch(e){}
            }

            // Generate 4-digit PIN
            myShortPin = Math.floor(1000 + Math.random() * 9000).toString();
            const fullId = ID_PREFIX + myShortPin;

            peer = new Peer(fullId, {
                debug: 1,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', (id) => {
                document.getElementById('my-uid').innerText = myShortPin;
                document.getElementById('status-msg').innerText = '✓ 準備完了 (4桁コード準備OK)';
                document.getElementById('status-msg').style.color = '#34d399';
            });

            peer.on('error', (err) => {
                console.error('PeerJS Error:', err);
                document.getElementById('status-msg').innerText = '接続エラー: リトライしてください';
                document.getElementById('status-msg').style.color = '#f87171';
                document.getElementById('retry-btn').classList.remove('is-hidden');
            });

            peer.on('connection', (dataConn) => {
                conn = dataConn;
                setupDataConnection();
            });

            peer.on('call', async (call) => {
                mediaCall = call;
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    mediaCall.answer(localStream);
                    
                    mediaCall.on('stream', (remoteStream) => {
                        const audio = document.getElementById('remote-audio');
                        audio.srcObject = remoteStream;
                        audio.play().catch(e => console.log('Autoplay audio warning:', e));
                    });
                } catch (err) {
                    console.warn('マイク応答不可:', err);
                }
            });
        }

        // Establish WebRTC Data & Voice Stream
        async function startConnection(selectedRole) {
            role = selectedRole;
            const inputCode = document.getElementById('target-uid').value.trim();

            if (!inputCode || inputCode.length < 4) {
                alert('相手の4桁コードを正しく入力してください。');
                return;
            }

            const targetFullId = ID_PREFIX + inputCode;

            document.getElementById('status-msg').innerText = '相手端末に接続中...';
            document.getElementById('status-msg').style.color = '#facc15';

            conn = peer.connect(targetFullId);
            setupDataConnection();

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                const call = peer.call(targetFullId, localStream);
                mediaCall = call;

                call.on('stream', (remoteStream) => {
                    const audio = document.getElementById('remote-audio');
                    audio.srcObject = remoteStream;
                    audio.play().catch(e => console.log('Audio autoplay warning:', e));
                });
            } catch (err) {
                console.warn('マイク無しでデータ通信継続:', err);
            }

            switchToAppUI();
        }

        function setupDataConnection() {
            conn.on('open', () => {
                document.getElementById('status-msg').innerText = '接続完了！';
                switchToAppUI();
            });

            conn.on('data', (data) => {
                if (data.type === 'key') {
                    handleKeyReceived(data.key);
                }
            });

            conn.on('close', () => {
                alert('通信が切断されました。');
            });
        }

        function switchToAppUI() {
            document.getElementById('setup-screen').classList.add('is-hidden');
            document.getElementById('reception-screen').classList.add('is-hidden');
            document.getElementById('keypad-screen').classList.add('is-hidden');

            if (role === 'reception') {
                document.getElementById('reception-screen').classList.remove('is-hidden');
            } else if (role === 'keypad') {
                document.getElementById('keypad-screen').classList.remove('is-hidden');
                requestFullscreen();
            }
        }

        function handleKeyReceived(key) {
            currentDial += key;
            document.getElementById('dial-display').innerText = currentDial;

            if ('speechSynthesis' in window) {
                let speechText = '';
                const prefix = document.getElementById('speech-prefix').value;
                const suffix = document.getElementById('speech-suffix').value;
                const customHash = document.getElementById('speech-custom-hash').value;

                if (key === '#') {
                    speechText = customHash;
                } else if (key === '*') {
                    speechText = 'アスタリスク';
                } else {
                    speechText = prefix + key + suffix;
                }

                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(speechText);
                utterance.lang = 'ja-JP';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function pressKey(key) {
            const display = document.getElementById('keypad-input-display');
            display.innerText += key;

            if (conn && conn.open) {
                conn.send({ type: 'key', key: key });
            }
        }

        function clearKeypad() {
            document.getElementById('keypad-input-display').innerText = '';
            currentDial = '';
            if (role === 'reception') {
                document.getElementById('dial-display').innerText = '---';
            }
        }

        function toggleMic() {
            if (localStream) {
                micEnabled = !micEnabled;
                localStream.getAudioTracks().forEach(track => track.enabled = micEnabled);
                
                const btn = document.getElementById('mic-toggle-btn');
                if (micEnabled) {
                    btn.className = 'btn btn-emerald';
                    btn.innerHTML = '🎤 マイク ON';
                } else {
                    btn.className = 'btn btn-red';
                    btn.innerHTML = '🔇 マイク OFF';
                }
            }
        }

        function requestFullscreen() {
            const el = document.documentElement;
            if (el.requestFullscreen) {
                el.requestFullscreen().catch(() => {});
            } else if (el.webkitRequestFullscreen) {
                el.webkitRequestFullscreen();
            }
        }

        window.onload = function() {
            initPeer();
        };
    </script>
</body>
</html>
